
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poultry Egg Production Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1, h2 {
            color: #263238;
        }

        form {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
        }

        input, button {
            padding: 11px;
            font-size: 15px;
            border-radius: 5px;
        }

        input {
            border: 1px solid #ccc;
        }

        button {
            background: #218838;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #176c2c;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .summary {
            display: flex;
            gap: 20px;
            margin: 25px 0;
        }

        .summary div {
            background: #e8f5e9;
            padding: 18px;
            border-radius: 8px;
            flex: 1;
        }

        .summary h3 {
            margin: 0 0 8px;
        }

        #message {
            margin: 15px 0;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #263238;
            color: white;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .summary {
                flex-direction: column;
            }

            .container {
                padding: 15px;
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Poultry Egg Production Tracker</h1>
    <p>Record and monitor daily egg production across your sheds.</p>

    <h2>Add Production Record</h2>

    <form id="eggForm">

        <label for="shed">Shed Name</label>
        <input
            type="text"
            id="shed"
            placeholder="e.g. Shed A"
            required
        >

        <label for="date">Production Date</label>
        <input
            type="date"
            id="date"
            required
        >

        <label for="count">Egg Count</label>
        <input
            type="number"
            id="count"
            min="0"
            step="1"
            placeholder="Enter number of eggs"
            required
        >

        <button type="submit" id="submitBtn">
            Submit Record
        </button>

    </form>

    <p id="message" role="status"></p>

    <div class="summary">

        <div>
            <h3>Total Eggs</h3>
            <p id="totalEggs">0</p>
        </div>

        <div>
            <h3>Total Records</h3>
            <p id="totalRecords">0</p>
        </div>

    </div>

    <h2>Production Records</h2>

    <table>
        <thead>
            <tr>
                <th>Shed</th>
                <th>Date</th>
                <th>Egg Count</th>
                <th>Running Total</th>
            </tr>
        </thead>

        <tbody id="recordsTable">
            <tr>
                <td colspan="4">Loading records...</td>
            </tr>
        </tbody>
    </table>

</div>

<script>

    const eggForm = document.getElementById("eggForm");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    // Set today's date as the default
    document.getElementById("date").value =
        new Date().toLocaleDateString("en-CA");

    // Retrieve and display all records
    async function loadRecords() {

        try {
            const response = await fetch("/api/eggs");

            if (!response.ok) {
                throw new Error("Could not retrieve records");
            }

            const data = await response.json();

            const table = document.getElementById("recordsTable");

            // Clear existing table rows
            table.replaceChildren();

            if (data.records.length === 0) {
                const row = table.insertRow();
                const cell = row.insertCell();

                cell.colSpan = 4;
                cell.textContent = "No production records yet.";

            } else {

                data.records.forEach(record => {

                    const row = table.insertRow();

                    row.insertCell().textContent = record.shed;
                    row.insertCell().textContent = record.date;
                    row.insertCell().textContent = record.count;
                    row.insertCell().textContent =
                        record.running_total;

                });

            }

            // Update summary
            document.getElementById("totalEggs").textContent =
                data.total_eggs;

            document.getElementById("totalRecords").textContent =
                data.total_records;

        } catch (error) {

            message.textContent = error.message;
            message.style.color = "red";

        }
    }


    // Handle form submission
    eggForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        submitBtn.disabled = true;
        message.textContent = "Saving record...";
        message.style.color = "#555";

        const record = {
            shed: document.getElementById("shed").value.trim(),
            date: document.getElementById("date").value,
            count: Number(document.getElementById("count").value)
        };

        try {

            const response = await fetch("/api/eggs", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(record)

            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || "Submission failed");
            }

            message.textContent = "Record saved successfully!";
            message.style.color = "green";

            // Clear the form
            eggForm.reset();

            // Restore today's date
            document.getElementById("date").value =
                new Date().toLocaleDateString("en-CA");

            // Retrieve updated records
            await loadRecords();

        } catch (error) {

            message.textContent = error.message;
            message.style.color = "red";

        } finally {

            submitBtn.disabled = false;

        }

    });


    // Load existing records when the page opens
    loadRecords();

</script>

</body>
</html>
